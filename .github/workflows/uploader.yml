name: Footballi Auto Uploader

on:
  schedule:
    # Runs automatically every 10 minutes, 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install libraries
        run: |
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 beautifulsoup4 requests

      - name: Load Google Credentials
        env:
          CLIENT_SECRETS: ${{ secrets.CLIENT_SECRETS }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          echo "$CLIENT_SECRETS" > client_secrets.json
          echo "$YOUTUBE_TOKEN" > token.json

      - name: Run Footballi Uploader
        run: python footballi_uploader.py

      - name: Save updated match history
        run: |
          git config user.name "Footballi Cloud Bot"
          git config user.email "bot@footballi.net"
          git fetch origin main
          git reset --soft origin/main
          git add uploaded_matches.json
          git commit -m "Auto-update uploaded videos list" || echo "No changes to commit"
          git push origin main
