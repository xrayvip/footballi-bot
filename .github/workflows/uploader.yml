name: Footballi YouTube Bot & Comment Manager

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: footballi-bot-runner
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ARVAN_API_KEY: ${{ secrets.ARVAN_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      CLIENT_SECRETS: ${{ secrets.CLIENT_SECRETS }}
      YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Footballi Pipeline (All-in-One Live Log)
        timeout-minutes: 7
        run: |
          echo "=== [1/4] Fast Setup: FFmpeg Static Binary & Python Packages (No apt-get) ==="
          if ! command -v ffmpeg &> /dev/null; then
            curl --max-time 25 -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | sudo tar -xJ --strip-components=2 -C /usr/local/bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          fi
          pip install --quiet --disable-pip-version-check requests beautifulsoup4 pillow google-api-python-client google-auth-oauthlib google-auth-httplib2 apify-client playwright
          echo "✅ Setup completed in seconds! FFmpeg: $(which ffmpeg) | Chrome: $(which google-chrome)"

          echo ""
          echo "=== [2/4] Running Footballi Video Uploader & Queue ==="
          timeout --kill-after=10s 240s stdbuf -oL -eL python -u footballi_uploader.py || echo "⚠️ [INFO] Uploader step finished."

          echo ""
          echo "=== [3/4] Running AI Comment Moderator & Responder ==="
          timeout --kill-after=10s 120s stdbuf -oL -eL python -u comment_manager.py || echo "⚠️ [INFO] Comment manager step finished."

          echo ""
          echo "=== [4/4] Saving Queue & Channel State ==="
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded_matches.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update video queue and indexed matches [skip ci]"
            git pull --rebase origin main || true
            git push
            echo "✅ State saved and pushed!"
          else
            echo "ℹ️ No changes to commit."
          fi
