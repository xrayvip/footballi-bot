name: Footballi YouTube Bot & Comment Manager

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: footballi-bot-runner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Fast Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow google-api-python-client google-auth-oauthlib google-auth-httplib2 apify-client

      - name: Run Footballi Uploader & Queue System
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARVAN_API_KEY: ${{ secrets.ARVAN_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          CLIENT_SECRETS: ${{ secrets.CLIENT_SECRETS }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          python -u footballi_uploader.py

      - name: Run AI Comment Moderator & Responder
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARVAN_API_KEY: ${{ secrets.ARVAN_API_KEY }}
          CLIENT_SECRETS: ${{ secrets.CLIENT_SECRETS }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          python -u comment_manager.py

      - name: Save Queue & Channel State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded_matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update video queue and indexed matches [skip ci]" && git push)
