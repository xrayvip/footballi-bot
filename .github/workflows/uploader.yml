name: Footballi Auto Uploader

on:
  schedule:
    # Runs automatically every 10 minutes, 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: |
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 beautifulsoup4 requests

      - name: Load Google Credentials
        env:
          CLIENT_SECRETS: ${{ secrets.CLIENT_SECRETS }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          echo "$CLIENT_SECRETS" > client_secrets.json
          echo "$YOUTUBE_TOKEN" > token.json

      - name: Run Footballi Uploader
        run: python footballi_uploader.py

      - name: Auto-commit updated history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update uploaded videos list"
          file_pattern: "uploaded_matches.json"
