name: Footballi Auto Uploader

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: footballi-uploader-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries and ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 beautifulsoup4 requests

      - name: Load Google Credentials
        env:
          CLIENT_SECRETS: ${{ secrets.CLIENT_SECRETS }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          echo "$CLIENT_SECRETS" > client_secrets.json
          echo "$YOUTUBE_TOKEN" > token.json

      - name: Run Footballi Uploader with AI & Instagram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -u footballi_uploader.py

      - name: Force-sync and save updated match history
        run: |
          cp uploaded_matches.json /tmp/uploaded_matches.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/uploaded_matches.json uploaded_matches.json
          git config user.name "Footballi Cloud Bot"
          git config user.email "bot@footballi.net"
          git add uploaded_matches.json
          git diff --staged --quiet || (git commit -m "Auto-update uploaded videos list" && git push --force origin main)
