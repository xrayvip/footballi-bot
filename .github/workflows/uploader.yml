name: Footballi Auto Uploader

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: footballi-uploader-group
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests beautifulsoup4 google-api-python-client google-auth-httplib2 google-auth-oauthlib Pillow

      - name: Restore Credentials
        env:
          CLIENT_SECRETS: ${{ secrets.CLIENT_SECRETS }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          echo "$CLIENT_SECRETS" > client_secrets.json
          echo "$YOUTUBE_TOKEN" > token.json

      - name: Run Uploader Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARVAN_API_KEY: ${{ secrets.ARVAN_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python -u footballi_uploader.py

      - name: Save Upload History
        run: |
          git config user.name "Footballi Bot"
          git config user.email "bot@footballi.net"
          if [ -f uploaded_matches.json ]; then
            cp uploaded_matches.json /tmp/uploaded_matches.json.bak
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/uploaded_matches.json.bak uploaded_matches.json
            git add uploaded_matches.json
            git diff --staged --quiet || git commit -m "Auto-update uploaded_matches.json"
            git push --force origin main
          fi
