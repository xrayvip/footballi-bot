name: Test Single AI Thumbnail

on:
  workflow_dispatch:
    inputs:
      video_url_or_id:
        description: 'لینک ویدیو یا شناسه یوتیوب (Video URL or ID)'
        required: true
        default: 'https://youtu.be/--vp7qA9TVw'

jobs:
  update_thumbnail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests google-api-python-client google-auth-httplib2 google-auth-oauthlib Pillow

      - name: Run Single Thumbnail Generator
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          ARVAN_API_KEY: ${{ secrets.ARVAN_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_VIDEO: ${{ inputs.video_url_or_id }}
        run: |
          python generate_thumbnails_batch.py
