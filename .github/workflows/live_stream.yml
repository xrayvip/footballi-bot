name: Footballi Live Match Streamer

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'منبع استریم (footballi برای پخش زنده خود سایت فوتبالی، یا custom برای وارد کردن لینک m3u8 دستی)'
        required: true
        default: 'footballi'
      custom_url:
        description: 'اگر منبع custom است، لینک مستقیم m3u8 را اینجا پیست کنید (در غیر این صورت خالی بگذارید)'
        required: false
        default: ''
      duration_minutes:
        description: 'مدت زمان پخش زنده به دقیقه (مثلا 130 دقیقه برای یک بازی کامل)'
        required: true
        default: '130'

jobs:
  start-live:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Install FFmpeg & Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests beautifulsoup4

      - name: Resolve Stream URL and Broadcast to YouTube
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          SOURCE_TYPE: ${{ github.event.inputs.source_type }}
          CUSTOM_URL: ${{ github.event.inputs.custom_url }}
          DURATION_MIN: ${{ github.event.inputs.duration_minutes }}
        run: |
          python3 -c "
          import os, re, requests, subprocess
          from bs4 import BeautifulSoup

          source_type = os.environ.get('SOURCE_TYPE', 'footballi')
          custom_url = os.environ.get('CUSTOM_URL', '').strip()
          stream_key = os.environ.get('STREAM_KEY', '').strip()
          duration_sec = int(os.environ.get('DURATION_MIN', '130')) * 60

          stream_url = ''

          if custom_url:
              stream_url = custom_url
              print(f'Using custom stream URL: {stream_url}')
          else:
              print('Scanning footballi.net/live for active live streams...')
              headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
              try:
                  res = requests.get('https://footballi.net/live', headers=headers, timeout=15)
                  html = res.text
                  # Search for .m3u8 live stream URLs in page source
                  m3u8_links = re.findall(r'https?://[^\s\"\'<>]+\.m3u8[^\s\"\'<>]*', html)
                  for l in m3u8_links:
                      if 'oddrun' in l or 'cdnboks' in l or 'footballi' in l:
                          stream_url = l
                          break
                  if not stream_url and m3u8_links:
                      stream_url = m3u8_links[0]
              except Exception as e:
                  print(f'Error fetching live page: {e}')

          if not stream_url:
              print('No active stream found on footballi.net/live right now (matches usually go live 10 minutes before kickoff).')
              exit(1)

          print(f'Found active stream: {stream_url}')
          print(f'Broadcasting to YouTube Live for {duration_sec} seconds...')

          cmd = [
              'ffmpeg',
              '-reconnect', '1', '-reconnect_at_eof', '1', '-reconnect_streamed', '1', '-reconnect_delay_max', '5',
              '-headers', 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)\r\n',
              '-i', stream_url,
              '-c:v', 'copy',
              '-c:a', 'aac', '-b:a', '128k', '-ar', '44100',
              '-t', str(duration_sec),
              '-f', 'flv', f'rtmp://a.rtmp.youtube.com/live2/{stream_key}'
          ]
          subprocess.run(cmd)
          "
