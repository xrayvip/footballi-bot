- name: Stream to YouTube Live
        env:
          STREAM_URL: ${{ inputs.stream_url }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # پاکسازی خودکار فاصله‌ها و کاراکترهای اضافی از ابتدا و انتهای لینک
          CLEAN_URL=$(echo "$STREAM_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'\'']//' -e 's/["'\'']$//')
          CLEAN_KEY=$(echo "$YOUTUBE_STREAM_KEY" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          CLEAN_DURATION=$(echo "$DURATION_MINUTES" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          echo "=========================================="
          echo "Starting Stream to YouTube Live..."
          echo "Title: ${{ inputs.stream_title }}"
          echo "Cleaned URL: $CLEAN_URL"
          echo "Duration: $CLEAN_DURATION minutes"
          echo "=========================================="

          # محاسبه مدت زمان به ثانیه
          DURATION_SEC=$(( CLEAN_DURATION * 60 ))

          # اجرای استریم پایدار با اتصال مجدد خودکار در صورت نوسان نت
          ffmpeg -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -i "$CLEAN_URL" \
            -t "$DURATION_SEC" \
            -c:v copy \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$CLEAN_KEY"
