name: Footballi Live Match Streamer

on:
  workflow_dispatch:
    inputs:
      match_title:
        description: 'عنوان بازی (مثلا: پخش زنده بازی استقلال و تراکتور)'
        required: true
        default: 'پخش زنده لیگ برتر ایران | Footballi Live'
      channel_source:
        description: 'شبکه پخش کننده (tv3 یا varzesh یا لینک مستقیم m3u8)'
        required: true
        default: 'tv3'
      duration_minutes:
        description: 'مدت زمان پخش زنده به دقیقه (مثلا 130 دقیقه برای یک بازی کامل)'
        required: true
        default: '130'

jobs:
  live-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Start YouTube Live Stream
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          SOURCE: ${{ github.event.inputs.channel_source }}
          DURATION_MIN: ${{ github.event.inputs.duration_minutes }}
        run: |
          if [ "$SOURCE" = "tv3" ]; then
            # لینک پخش زنده شبکه سه
            STREAM_URL="https://lenz.splus.ir/PLTV/88888888/224/3221226845/index.m3u8"
          elif [ "$SOURCE" = "varzesh" ]; then
            # لینک پخش زنده شبکه ورزش
            STREAM_URL="https://lenz.splus.ir/PLTV/88888888/224/3221226872/index.m3u8"
          else
            STREAM_URL="$SOURCE"
          fi

          DURATION_SEC=$((DURATION_MIN * 60))
          echo "Starting Live Stream for $DURATION_MIN minutes..."

          ffmpeg -re -i "$STREAM_URL" \
            -c:v copy -c:a aac -b:a 128k -ar 44100 \
            -t "$DURATION_SEC" \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
